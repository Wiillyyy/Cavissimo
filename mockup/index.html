<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <title>Cavissimo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body>

  <div id="loader">

        <path class="glass-outline" d="M12 4 H52 L46 42 C46 54 18 54 18 42 L12 4 Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
        <path class="glass-fill" d="M15 10 H49 L45 40 C45 50 19 50 19 40 L15 10 Z" fill="currentColor"/>
        <line class="glass-stem" x1="32" y1="54" x2="32" y2="72" stroke="currentColor" stroke-width="2"/>
        <line class="glass-base" x1="20" y1="76" x2="44" y2="76" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <h1 class="loader-title">Cavissimo</h1>
      <p class="loader-tagline">Votre cave, sublimée</p>
    </div>
  </div>

  <nav class="navbar" id="navbar">
    <div class="navbar-inner">
      <a href="#" class="navbar-brand">Cavissimo</a>
      <ul class="navbar-links">
        <li><a href="#" class="active">Tableau de bord</a></li>
        <li><a href="#">Ma cave</a></li>
        <li><a href="#">Catalogue</a></li>
        <li><a href="#">Dégustations</a></li>
      </ul>
      <div class="navbar-user">
        <span class="avatar">W</span>
      </div>
    </div>
  </nav>

  <main>
    <section class="hero">
      <p class="hero-eyebrow">Étape 1 — coquille &amp; chargement</p>
      <h1 class="hero-title">Bienvenue dans votre cave, William</h1>
      <p class="hero-subtitle">Le reste de la page (dashboard, étagères, bouteilles) arrive aux prochaines étapes.</p>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
